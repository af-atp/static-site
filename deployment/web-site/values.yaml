# Global configuration for the appsfactory StaticSite operator
staticSite:
  # The repository you created
  gitRepositoryUrl: "https://github.com/af-atp/static-site"
  
  # Desired scale configuration
  replicas: 2
  
  # The internal port Nginx should expose
  targetPort: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "kube-local-ca-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/hsts: "false"
  host: "portal.kube.local"
  path: "/"
  pathType: "Prefix"
  tls:
    enabled: true
    secretName: "portal-kube-local-tls"
    hosts:
      - "portal.kube.local"