apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kube-local-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: kube.local Root CA
  secretName: kube-local-root-ca
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kube-local-ca-issuer
spec:
  ca:
    secretName: kube-local-root-ca
